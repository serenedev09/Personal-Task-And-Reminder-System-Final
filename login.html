<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MyEstia Personal Task & Reminder System</title>

  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
  <div class="auth-page-container">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="brand-icon">
          <i class="fa-solid fa-stopwatch"></i>
        </div>
        <h2>MyEstia</h2>
        <p>Sign in to your personal task & reminder workspace</p>
      </div>

      <!-- Demo 1-Click Login Button -->
      <button type="button" class="demo-login-btn" id="btn-demo-login">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span>Try Demo Account (1-Click Login)</span>
      </button>

      <div class="auth-divider">
        <span>or sign in with credentials</span>
      </div>

      <form id="login-form">
        <div class="form-group" style="margin-bottom: 1rem;">
          <label class="form-label" for="login-username">Username or Email</label>
          <input type="text" id="login-username" class="form-input" placeholder="demo or alex@myestia.app" required
            autofocus>
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="form-label" for="login-password" style="margin-bottom: 0;">Password</label>
            <span style="font-size: 0.75rem; color: var(--text-subtle);">Default: password123</span>
          </div>
          <div style="position: relative;">
            <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
            <button type="button" id="toggle-password"
              style="position: absolute; right: 0.75rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-subtle); cursor: pointer;">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary auth-btn-block" id="btn-submit-login">
          <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In
        </button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="{{ url_for('register_page') }}" style="font-weight: 600;">Create one now</a>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="{{ url_for('static', filename='js/api.js') }}"></script>
  <script>
    const form = document.getElementById('login-form');
    const demoBtn = document.getElementById('btn-demo-login');
    const pwdToggle = document.getElementById('toggle-password');
    const pwdInput = document.getElementById('login-password');

    // Password visibility toggle
    pwdToggle.addEventListener('click', () => {
      const isPwd = pwdInput.type === 'password';
      pwdInput.type = isPwd ? 'text' : 'password';
      pwdToggle.innerHTML = isPwd ? '<i class="fa-regular fa-eye-slash"></i>' : '<i class="fa-regular fa-eye"></i>';
    });

    // Form Submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const username_or_email = document.getElementById('login-username').value.trim();
      const password = pwdInput.value;
      const submitBtn = document.getElementById('btn-submit-login');

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Signing In...';

      try {
        const res = await API.auth.login(username_or_email, password);
        if (res.success) {
          API.showToast(res.message || 'Login successful!', 'success');
          setTimeout(() => {
            window.location.href = "{{ url_for('index_page') }}";
          }, 400);
        } else {
          API.showToast(res.message || 'Invalid credentials', 'error');
        }
      } catch (err) {
        API.showToast(err.message || 'An error occurred during login', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In';
      }
    });

    // Demo Login
    demoBtn.addEventListener('click', async () => {
      demoBtn.disabled = true;
      demoBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Initializing Demo Session...';

      try {
        const res = await API.auth.demoLogin();
        if (res.success) {
          API.showToast('Logged in as Demo User!', 'success');
          setTimeout(() => {
            window.location.href = "{{ url_for('index_page') }}";
          }, 400);
        } else {
          API.showToast(res.message || 'Could not start demo session', 'error');
        }
      } catch (err) {
        API.showToast(err.message || 'Demo login failed', 'error');
      } finally {
        demoBtn.disabled = false;
        demoBtn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> Try Demo Account (1-Click Login)';
      }
    });
  </script>
</body>

</html>
